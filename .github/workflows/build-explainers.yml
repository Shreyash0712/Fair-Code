name: Build Explainers

on:
  push:
    branches: [main]
    paths:
      - "explainers/**.md"
      - "assets/explainers-data.json"
      - "scripts/build_explainers.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate explainer pages, data.js, and sitemap
        run: python3 scripts/build_explainers.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add explainers/*.html assets/explainers-data.js sitemap.xml
          git diff --cached --quiet || git commit -m "chore: regenerate explainer pages"
          git push
