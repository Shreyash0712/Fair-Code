name: lint

on:
  push:
  pull_request:

jobs:
  em-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Enforce em-dash-free rule (use ' - ', not an em dash)
        run: make lint
