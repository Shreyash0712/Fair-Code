name: PR Review Ping

# Comments on every new PR, tagging the maintainers CODEOWNERS routes review
# to (@yakew7, @ahmdkaml) so they're notified even when GitHub's own
# auto-request doesn't fire - e.g. a code owner hasn't accepted their
# collaborator invite yet, or the PR doesn't touch a CODEOWNERS-matched path.
# This is a notification only: it does not request review, assign anyone, or
# gate merging - see .github/CODEOWNERS and branch protection for that.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Mention reviewers
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const REVIEWERS = ['yakew7', 'ahmdkaml'];
            const author = context.payload.pull_request.user.login;
            const toMention = REVIEWERS.filter((login) => login !== author);
            if (toMention.length === 0) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: toMention.map((login) => `@${login}`).join(' ') + ' - new PR to review.'
            });
